# Reviewed Cashu mints for /nutzaps and the paid `nutzaps.active_users` metric
# (nostrology-data#9). Parsed by loader/nutzap_mints.py; materialised into
# nutzap_mint_classes on every nutzaps_refresh (loader --classify-nutzap-mints).
#
# Classes. "Excluded" = out of value, payments, senders (MAU), the /nutzaps/mints
# leaderboard, "Configured By" and the per-mint pages.
#   fake-backend       excluded  the mint's operator says its Lightning backend is fake:
#                                 invoices are marked paid without payment, so its
#                                 ecash is unbacked.
#   test-mint-gone     excluded  published as a test mint and no longer answers.
#   test-wording-live  counted   calls itself test/demo, but settles real Lightning.
#                                 Wording alone is not grounds for exclusion
#                                 (8333.space:3338 is the example).
#   unreachable        counted   does not answer today; its past payments were real.
# Not written here:
#   private-host       excluded  automatic: loopback, RFC 1918, link-local, CGNAT,
#                                 .local/.internal/..., single-label hosts. See
#                                 nutzap_mints.private_host_reason.
#   unreviewed         counted   every mint not listed; never presumed fake.
#
# Each entry names exactly ONE of:
#   url:  one mint, written exactly as the loader stores it (normalized: lowercase
#         scheme and host, no default port, no trailing slash, path case kept);
#   host: every URL on that host, any scheme, port or path.
# plus class, evidence (a URL or a quote), as_of (the date the evidence was checked)
# and reviewer. The loader refuses a malformed file, so a typo fails the refresh
# instead of silently counting a test mint.
#
# Public-seed keysets are per keyset, not per mint, and
# are deliberately NOT here yet: that needs per-proof keyset ids in the table.

mints:

# -- fake-backend: the Cashu project's own testnut family ---------------------------
- host: testnut.cashu.space
  class: fake-backend
  evidence: >-
    Its NUT-06 info, 2026-09-18: "It uses a FakeWallet, all your Lightning invoices
    will always be marked paid so that you can test minting and melting ecash via
    Lightning." docs.cashu.space FAQ: "a testnut mint with fees with unbacked fake
    ecash for testing"
    https://github.com/cashubtc/docs.cashu.space/blob/358e62d581ab34b50f0bcad505097273e69610fd/src/pages/faq.mdx#L68-L72
  as_of: 2026-09-18
  reviewer: agent
- host: nofee.testnut.cashu.space
  class: fake-backend
  evidence: >-
    awesome-cashu: "a testnut mint with no fees with unbacked fake ecash for testing"
    https://github.com/cashubtc/awesome-cashu/blob/82c892bae3df544c3b0bf86fb57e6a77fef21f0b/README.md#L164-L166
    Its NUT-06 info, 2026-09-18: "Testnut feeless mint ... use testnut.cashu.space for testing."
  as_of: 2026-09-18
  reviewer: agent
- host: nofees.testnut.cashu.space
  class: fake-backend
  evidence: >-
    docs.cashu.space FAQ: "a testnut mint with no fees with unbacked fake ecash for
    testing" (the FAQ spells it nofees., awesome-cashu nofee.; both circulate)
    https://github.com/cashubtc/docs.cashu.space/blob/358e62d581ab34b50f0bcad505097273e69610fd/src/pages/faq.mdx#L68-L72
  as_of: 2026-09-18
  reviewer: agent

